models:
  - name: stg_coins_markets
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - coin_id
              - last_updated
    columns:
      - name: coin_id
        tests:
          - not_null
  - name: stg_coin_info
    columns:
      - name: coin_id
        tests:
          - not_null
          - unique
  - name: stg_price_history
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - coin_id
              - date_timestamp
    columns:
      - name: coin_id
        tests:
          - not_null